  e executava o CRM inteiro (1,5 MB) — rotas internas, papéis de usuário, regras de
  negócio de Comercial, Financeiro e Operações. Nenhum dado vazava (as chamadas internas
  exigem token de equipe), mas a planta baixa do sistema ia junto com o anúncio de emprego.

  Este arquivo é AUTOSSUFICIENTE, no mesmo espírito do index.html: HTML, CSS e JS inline,
  sem build. Foi gerado uma vez a partir do index e a partir daqui é editado direto.

  O que é duplicado de propósito (e precisa ser mantido em sintonia se mudar lá):
    esc()             anti-XSS
    t() / i18n        só as chaves pub_* / disc_* — não as do CRM
    tokens de tema    o bloco :root do index
    normalizeStr()    comparação de texto sem acento
    helpers de modal  openModal / closeModal / bgClose

  Links antigos (agroforce.agrosearch.com.br/#/vaga/123) continuam válidos: o index.html
  tem um redirecionamento no topo do <head> que manda para cá preservando o hash.
-->

#view-ops .row-title .badge, #view-ops .card-title .badge{margin-left:8px; vertical-align:middle; flex:none;}
#view-ops{--amber:#E0A800;--blue:#2176AE;--red:#D62828;--purple:#7c3aed;}
:root.dark #view-ops{--amber:#fbbf24;--blue:#5b9bff;--red:#ff6b6b;--purple:#b794f4;}
#view-ops .ops-topbar{height:56px; flex:none; display:flex; align-items:center; gap:14px; padding:0 18px;
    background:var(--surface); border-bottom:1px solid var(--border); position:relative;}#view-ops .brand{font-weight:700; font-size:15px; letter-spacing:-.01em; margin-right:4px; white-space:nowrap;}#view-ops .tabs{display:flex; gap:2px; flex:1; overflow-x:auto;}#view-ops .tab{padding:7px 13px; border-radius:8px; font-size:13px; font-weight:600; color:var(--text-dim); white-space:nowrap;}#view-ops .tab.ops-active{background:var(--green-soft-bg); color:var(--green-text);}#view-ops .tab.new::after{content:"novo"; font-size:9px; font-weight:700; text-transform:uppercase; background:var(--green-btn);
    color:var(--on-green); padding:1px 5px; border-radius:6px; margin-left:6px; vertical-align:1px;}#view-ops .top-right{display:flex; align-items:center; gap:8px; flex:none;}#view-ops .view-as{display:flex; background:var(--surface-2); border-radius:8px; padding:3px; gap:2px;}#view-ops .view-as button{border:none; background:transparent; padding:5px 10px; border-radius:6px; font-size:11.5px; font-weight:600; color:var(--text-dim); cursor:pointer;}#view-ops .view-as button.ops-active{background:var(--surface); color:var(--text); box-shadow:0 1px 2px var(--shadow);}#view-ops .theme-btn{border:1px solid var(--border); background:var(--surface); border-radius:8px; cursor:pointer; color:var(--text-dim);
    font-size:12px; font-weight:600; padding:7px 10px;}#view-ops .theme-btn:hover{background:var(--surface-3);}#view-ops .avatar{width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:var(--green-soft-bg); color:var(--green-text); font-weight:700; font-size:11px; padding:0; border:none;}#view-ops .filterbar{min-height:48px; flex:none; display:flex; align-items:center; gap:10px; padding:8px 18px; flex-wrap:wrap;
    background:var(--surface); border-bottom:1px solid var(--border);}#view-ops .seg{display:flex; background:var(--surface-2); border-radius:8px; padding:3px; gap:2px;}#view-ops .seg button{border:none; background:transparent; padding:5px 11px; border-radius:6px; font-size:12.5px; font-weight:600; color:var(--text-dim); cursor:pointer;}#view-ops .seg button.ops-active{background:var(--surface); color:var(--text); box-shadow:0 1px 2px var(--shadow);}#view-ops .filter-count{margin-left:auto; font-size:12px; color:var(--text-faint); white-space:nowrap;}#view-ops .ops-btn-outline{border:1px solid var(--border-strong); background:var(--surface); color:var(--text-dim); border-radius:8px; padding:6px 11px; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap;}#view-ops .ops-btn-outline:hover{background:var(--surface-3); color:var(--text);}#view-ops .flag-filter{position:relative;}#view-ops .flag-filter-btn{border:1px solid var(--border-strong); background:var(--surface); color:var(--text-dim); border-radius:8px; padding:6px 11px; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; display:inline-flex; align-items:center; gap:6px;}#view-ops .flag-filter-btn:hover{background:var(--surface-3); color:var(--text);}#view-ops .flag-filter-btn.has-active{border-color:var(--text); color:var(--text);}#view-ops .flag-filter-btn .count{background:var(--text); color:var(--bg); font-size:10px; font-weight:700; border-radius:20px; padding:1px 6px; min-width:14px; text-align:center; display:none;}#view-ops .flag-pop{position:absolute; top:38px; left:0; width:250px; background:var(--surface); border:1px solid var(--border);
    border-radius:12px; box-shadow:0 8px 24px var(--shadow); padding:8px; display:none; z-index:60;}#view-ops .flag-pop.ops-show{display:block;}#view-ops .flag-pop label{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text); padding:6px 6px; border-radius:6px; cursor:pointer;}#view-ops .flag-pop label:hover{background:var(--surface-3);}#view-ops .flag-pop label input{margin:0;}#view-ops .flag-pop-actions{display:flex; justify-content:flex-end; margin-top:4px; padding-top:8px; border-top:1px solid var(--border);}#view-ops .flag-pop-actions button{border:none; background:transparent; color:var(--text-dim); font-size:11.5px; font-weight:700; cursor:pointer; padding:4px 6px;}#view-ops .flag-pop-actions button:hover{color:var(--text); text-decoration:underline;}#view-ops .settings-dd{position:relative;}#view-ops .settings-pop{position:absolute; top:38px; right:0; width:230px; background:var(--surface); border:1px solid var(--border);
    border-radius:12px; box-shadow:0 8px 24px var(--shadow); padding:6px; display:none; z-index:60;}#view-ops .settings-pop.ops-show{display:block;}#view-ops .settings-pop-item{padding:8px 10px; font-size:12.5px; color:var(--text); border-radius:6px; cursor:pointer;}#view-ops .settings-pop-item:hover{background:var(--surface-3);}#view-ops .layout{flex:1; min-height:0; display:flex;}#view-ops .main{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}#view-ops .ops-view{flex:1; overflow-y:auto; padding:14px 18px; scrollbar-width:auto; scrollbar-color:var(--border-strong) var(--surface-2);}#view-ops .ops-view::-webkit-scrollbar{width:12px; height:12px;}#view-ops .ops-view::-webkit-scrollbar-track{background:var(--surface-2);}#view-ops .ops-view::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:7px; border:2px solid var(--surface-2);}#view-ops .ops-view::-webkit-scrollbar-thumb:hover{background:var(--text-faint);}#view-ops .ops-view.hidden{display:none;}#view-ops .unassigned-box{border:1px solid var(--amber); background:var(--surface-2); border-radius:12px; margin-bottom:16px; overflow:hidden;}#view-ops .unassigned-head{padding:10px 14px; font-weight:700; font-size:12.8px; color:var(--text); background:#fdf0d5;}:root.dark #view-ops .unassigned-head{background:#3a2c0d;}#view-ops .unassigned-row{display:flex; align-items:center; gap:10px; padding:10px 14px; border-top:1px solid var(--border);}#view-ops .unassigned-row .row-main{flex:1; cursor:pointer;}#view-ops .unassigned-row .row-title{font-weight:700; font-size:12.8px;}#view-ops .unassigned-row .row-sub{font-size:11.3px; color:var(--text-dim);}#view-ops .assign-btn{border:1px solid var(--green-strong); color:var(--green-text); background:var(--green-soft-bg); border-radius:8px;
    padding:6px 12px; font-size:11.8px; font-weight:700; cursor:pointer; white-space:nowrap;}#view-ops .group{margin-bottom:16px; border:1px solid var(--border); border-radius:12px; overflow:hidden; background:var(--surface);}#view-ops .group-head{display:flex; align-items:center; gap:10px; padding:11px 14px; background:var(--surface-2);}#view-ops .group-avatar{width:26px; height:26px; border-radius:50%; background:var(--green-soft-bg); color:var(--green-text); font-size:10.5px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:none;}#view-ops .group-name{font-weight:700; font-size:13.3px;}#view-ops .group-role{font-size:10.5px; color:var(--text-faint); font-weight:600; text-transform:uppercase;}#view-ops .group-count{margin-left:auto; font-size:11.5px; color:var(--text-faint); font-weight:600;}#view-ops .row{display:flex; align-items:center; gap:12px; padding:10px 14px; border-top:1px solid var(--border); cursor:pointer;}#view-ops .row:hover{background:var(--surface-2);}#view-ops .row-main{flex:1; min-width:0;}#view-ops .row-title{font-weight:700; font-size:12.8px; margin-bottom:2px; white-space:nowrap; display:flex; align-items:center; gap:5px;}#view-ops .row-title .row-title-text{overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1;}#view-ops .row-sub{font-size:11.3px; color:var(--text-dim); display:flex; gap:6px; align-items:center; flex-wrap:wrap;}#view-ops /* Etapa e Divisão deixaram de ser "pills": stage-chip agora é só texto + o pontinho colorido (sem fundo), #view-ops no mesmo peso visual de um dado estrutural — não compete com os badges de urgência do cluster .flags. */

#public-shell .pub-header .pub-logo{flex-shrink:0;width:calc(15vw - 23px);height:auto;aspect-ratio:932/110;margin-top:calc(10.23px - .528vw)}
#public-shell .pub-nav{display:flex;align-items:center;margin-left:auto;flex-wrap:nowrap}
#public-shell .pub-nav>a,#public-shell .pub-nav .pub-nav-dd-trigger{display:flex;align-items:center;margin:0;background:none;border:none;cursor:pointer;font-family:'Montserrat',sans-serif;font-size:14px;font-weight:400;line-height:20px;letter-spacing:-0.2px;text-transform:uppercase;color:#54595f;text-decoration:none;padding:13px 14px;white-space:nowrap;transition:color .4s}
#public-shell .pub-nav>a:hover,#public-shell .pub-nav .pub-nav-dd:hover>.pub-nav-dd-trigger,#public-shell .pub-nav .pub-nav-dd:focus-within>.pub-nav-dd-trigger{color:#919f2d}
#public-shell .pub-nav>a.pub-nav-active{color:#56a93a}
/* Seta ▾ do submenu: o mesmo desenho (caret-down cheio) e o mesmo respiro de 10px do
   site; pinta com a cor do texto, então fica oliva junto no hover. */
#public-shell .pub-caret{display:flex;align-items:center;padding-left:10px}
#public-shell .pub-caret svg{width:14px;height:14px;fill:currentColor}
/* "Para sua empresa" — abre no hover (como no site), no foco via teclado e no clique
   (.dd-open, PublicATS.toggleNavDd — o caminho garantido no toque). */
#public-shell .pub-nav .pub-nav-dd{position:relative}
#public-shell .pub-nav .pub-nav-dd-panel{position:absolute;top:100%;left:0;min-width:130px;background:#fff;display:none;flex-direction:column;z-index:3}
#public-shell .pub-nav .pub-nav-dd:hover .pub-nav-dd-panel,#public-shell .pub-nav .pub-nav-dd:focus-within .pub-nav-dd-panel,#public-shell .pub-nav .pub-nav-dd.dd-open .pub-nav-dd-panel{display:flex}
#public-shell .pub-nav .pub-nav-dd-panel a{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;font-size:13px;font-weight:400;line-height:20px;text-transform:uppercase;color:#33373d;text-decoration:none;padding:13px 20px;border-left:8px solid transparent;white-space:nowrap}
#public-shell .pub-nav .pub-nav-dd-panel a:hover{background:#56a93a;color:#fff}
#public-shell .pub-header-right{display:flex;align-items:center;margin-left:20px;flex-shrink:0}
#public-shell .pub-lang-switch{display:flex;align-items:center;gap:2px;margin-top:3.6px}
#public-shell .pub-lang-switch button{width:24px;height:18px;padding:0;border:none;border-radius:0;cursor:pointer;opacity:.8;background-color:transparent;background-size:cover;background-position:center;background-repeat:no-repeat}
#public-shell .pub-lang-switch button[title="Español"]{width:26px;height:17px}
#public-shell .pub-lang-switch button:hover{opacity:1}
/* Hambúrguer (só abaixo de 1280px): caixinha cinza 33x33 com ícone verde, igual ao
   site; vira X quando o menu está aberto. */
#public-shell .pub-menu-toggle{display:none;align-items:center;justify-content:center;width:33px;height:33px;box-sizing:border-box;padding:5.5px;margin-right:20px;border:none;border-radius:3px;background:rgba(0,0,0,.05);cursor:pointer}
#public-shell .pub-menu-toggle svg{width:22px;height:22px;fill:#56a93a}
#public-shell .pub-menu-toggle .pub-ic-close,#public-shell .pub-header.menu-open .pub-menu-toggle .pub-ic-open{display:none}
#public-shell .pub-header.menu-open .pub-menu-toggle .pub-ic-close{display:block}
/* Menu do celular: faixa branca de largura total logo abaixo do cabeçalho (não gaveta
   lateral), como no site. Cada item só tem a largura do texto — por isso o fundo da
   página atual (oliva) e do toque/hover (verde) não atravessa a tela. Submenu abre
   embaixo do item, recuado (no site real ele abre "voando" por cima da lista, quebrado
   — não copiado). */
#public-shell .pub-mobile-menu{display:none;position:absolute;left:0;right:0;top:calc(100% - 4px);background:#fff;z-index:2}
#public-shell .pub-header.menu-open .pub-mobile-menu{display:block}
#public-shell .pub-mobile-nav{display:flex;flex-direction:column;align-items:flex-start}
#public-shell .pub-mobile-nav>a,#public-shell .pub-mobile-nav .pub-nav-dd-trigger{display:flex;align-items:center;margin:0;background:none;border:none;cursor:pointer;text-align:left;font-family:'Montserrat',sans-serif;font-size:14px;font-weight:400;line-height:20px;letter-spacing:-0.2px;text-transform:uppercase;color:#33373d;text-decoration:none;padding:19px 27px;transition:color .4s,background-color .4s}
#public-shell .pub-mobile-nav>a:hover,#public-shell .pub-mobile-nav .pub-nav-dd-trigger:hover,#public-shell .pub-mobile-nav .pub-nav-dd.dd-open>.pub-nav-dd-trigger{background:#56a93a;color:#fff}
#public-shell .pub-mobile-nav>a.pub-nav-active{background:#919f2d;color:#fff}
#public-shell .pub-mobile-nav .pub-caret svg{fill:#000}
#public-shell .pub-mobile-nav .pub-nav-dd{display:flex;flex-direction:column;align-items:flex-start}
#public-shell .pub-mobile-nav .pub-nav-dd-panel{display:none;flex-direction:column;align-items:flex-start}
#public-shell .pub-mobile-nav .pub-nav-dd.dd-open .pub-nav-dd-panel{display:flex}
#public-shell .pub-mobile-nav .pub-nav-dd-panel a{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;font-size:13px;line-height:20px;text-transform:uppercase;color:#33373d;text-decoration:none;padding:19px 27px 19px 47px;transition:color .4s,background-color .4s}
#public-shell .pub-mobile-nav .pub-nav-dd-panel a:hover{background:#56a93a;color:#fff}

#public-shell .pub-wrap{display:grid;grid-template-columns:1.3fr 1fr;gap:48px;padding:36px 40px 70px;max-width:1220px;margin:0 auto}
#public-shell .pub-main h1{font-size:28px;margin:6px 0 10px;text-wrap:balance}
#public-shell .pub-main h3{font-size:15px;margin:22px 0 8px}
#public-shell .pub-main p{color:var(--text-dim);line-height:1.6;font-size:14px}
#public-shell .pub-main ul{margin:0;padding-left:18px;color:var(--text-dim);font-size:14px;line-height:1.8}
#public-shell .pub-tag{display:inline-block;background:var(--green-soft-bg);color:var(--green-text);font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;margin-bottom:10px}
#public-shell .pub-empty,#public-shell .pub-loading{padding:60px 20px;text-align:center;color:var(--text-dim);font-size:14px}
#public-shell .pf-consent{display:flex;align-items:flex-start;gap:9px;font-size:12px;color:var(--text-dim);line-height:1.5;cursor:pointer}
#public-shell .pf-consent input{margin-top:2px;flex-shrink:0;width:15px;height:15px;cursor:pointer}
#public-shell .pf-radio-group{display:flex;flex-direction:column;gap:8px;margin-top:6px}
#public-shell .pf-field .pf-radio-opt{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:400;color:var(--text);line-height:1.4;cursor:pointer;margin-bottom:0}
/* .pf-field input,select,textarea (regra genérica dos campos de texto) espicha
   qualquer <input> a width:100% — sem isso o rádio herdava 100% da largura da
   linha inteira, empurrando o texto da opção pra fora da vista. */
#public-shell .pf-field .pf-radio-opt input{width:16px;height:16px;flex-shrink:0;padding:0;border:none;background:none}
#public-shell .pf-radio-opt input{flex-shrink:0;width:15px;height:15px;cursor:pointer}
#public-shell .pub-form{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:32px;height:fit-content;display:flex;flex-direction:column;gap:16px}

/* Abaixo de 1280px: hambúrguer. Entre 1025px e 1279px o site real ainda mostra o menu
   de cima, mas ele quebra em 2 linhas e empurra a logo pra baixo (defeito de lá) — aqui
   vira hambúrguer em vez de copiar a quebra. Tablet: logo fixa em 216px, botão encostado
   no alto (20px) e bandeiras um pouco mais baixas — desalinhamento leve que existe no
   site e foi mantido pra ficar igual. */
@media (max-width:1279px){
  #public-shell{--pub-header-h:81px}
  #public-shell .pub-header{padding-right:clamp(12px,14.06vw - 111.3px,33px)}
  #public-shell .pub-header .pub-logo{width:216px;margin-top:1px;margin-left:clamp(0px,15.7vw - 132.7px,28px)}
  #public-shell .pub-nav{display:none}
  #public-shell .pub-menu-toggle{display:flex}
  #public-shell .pub-header-right{margin-left:auto;align-self:flex-start;margin-top:20px}
  #public-shell .pub-lang-switch{margin-top:11.6px}
  #public-shell .pub-mobile-menu{top:calc(100% - 8px)}
}
/* Celular (até 767px): logo, botão e bandeiras com as mesmas proporções do site —
   espaços em vw, então as bandeiras não encostam na borda direita (como lá). */
@media (max-width:767px){
  #public-shell .pub-header{padding-right:0}
  #public-shell .pub-header .pub-logo{width:calc(45vw - 29px);margin-left:0;margin-top:clamp(0px,11.63px - 1.94vw,3.6px)}
  #public-shell .pub-header-right{margin-left:calc(12vw - 1.7px);align-self:center;margin-top:0}
  #public-shell .pub-menu-toggle{margin-right:calc(11.9vw - 21.2px)}
  #public-shell .pub-lang-switch{margin-top:3.6px}
  #public-shell .pub-mobile-menu{top:calc(100% - 4px)}
}
@media (max-width:820px){
  #public-shell .pub-wrap{grid-template-columns:1fr;gap:24px;padding:20px 20px 60px}
  #public-shell .pub-form{order:-1}
  #public-shell .pub-main h1{font-size:22px}
}

<script>
// ── Base compartilhada com o app interno (cópia mínima, ver comentário no <head>) ──
var _storage={_d:{},getItem:function(k){try{return localStorage.getItem(k);}catch(e){return this._d[k]||null;}},setItem:function(k,v){try{localStorage.setItem(k,v);}catch(e){this._d[k]=v;}}};

// Escape de HTML para dados vindos do candidato/API interpolados em innerHTML (anti-XSS).
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

// Comparação de texto sem acento/pontuação (usada na busca de vagas).
function normalizeStr(s){
  return String(s||'').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9\s]/g,'').replace(/\s+/g,' ').trim();
}

// Idioma: mesma chave do app interno, para quem já escolheu um idioma não recomeçar.
var currentLang='pt';
try{ var _l=_storage.getItem('vf-lang'); if(_l&&['pt','es','en'].indexOf(_l)>=0)currentLang=_l; }catch(e){}
// setLang() do app interno (ui/index.html) faz muita coisa específica de tela do CRM
// (editor de proposta, filtros etc.) que não existe aqui — versão própria e mais simples:
// troca o idioma, persiste, e re-roteia pra RE-RENDERIZAR a página atual do zero (o
// header com as bandeiras e todo o texto fixo são montados via t() interpolado direto
// na string em cada render — não são data-i18n — então só isso já resolve; não existia
// nenhuma versão desta função no portal antes, achado real 15/09/2026: as bandeiras
// nunca fizeram nada, onclick chamava uma função inexistente nesse arquivo.
function setLang(lang){
  currentLang=lang;
  _storage.setItem('vf-lang',lang);
  document.documentElement.lang=lang==='pt'?'pt-BR':(lang==='es'?'es':'en');
  PublicATS.route();
}

// Tema. Mesma mecânica do app interno: quem troca --bg/--text/--green é a CLASSE
// .dark/.light no <html>. O @media(prefers-color-scheme) sozinho só redefine
// --bg-primary/--tx-*/--bd-*, então sem a classe a página ficaria clara mesmo com o
// sistema no escuro. Preferência salva vence; sem ela, segue o sistema.
var currentTheme='light';
try{
  var _ct=_storage.getItem('vf-theme');
  if(_ct==='dark'||_ct==='light'){ currentTheme=_ct; }
  else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches){ currentTheme='dark'; }
}catch(e){ currentTheme='light'; }
document.documentElement.classList.remove('dark','light');
document.documentElement.classList.add(currentTheme);

// Modais (só a política de privacidade usa, hoje).
function openModal(id){var el=document.getElementById(id);if(el)el.classList.add('open');}
function closeModal(id){var el=document.getElementById(id);if(el)el.classList.remove('open');}
var _bgMouseDownTarget=null;
document.addEventListener('mousedown',function(e){_bgMouseDownTarget=e.target;});
function bgClose(e,id){var overlay=document.getElementById(id);if(e.target===overlay&&_bgMouseDownTarget===overlay)closeModal(id);}

  en:`
<p><b>Last updated:</b> August 25, 2026</p>
<p>This notice explains how AGROSearch processes the personal data of candidates who register on this portal, in accordance with Brazil's General Data Protection Law (Law No. 13,709/2018 — LGPD).</p>
<h4>1. Who is the controller of your data</h4>
<p>AGROSearch Recrutamento e Seleção, responsible for conducting recruitment processes for client companies in the agribusiness sector.</p>
<h4>2. What data we collect</h4>
<ul>
<li>Identification and contact: name, email, phone number, city, state, and country.</li>
<li>Professional data: résumé, education, work experience, current role and company, salary expectations, languages, area of expertise, and segment of interest.</li>
<li>Possibly sensitive data, provided only if you choose to fill it in: gender and the result of the behavioral test (DISC), if you decide to take it.</li>
</ul>
<h4>3. What we use your data for</h4>
<ul>
<li>Evaluate your application and its fit with the chosen position.</li>
<li>Prepare profile reports for the client company responsible for the position.</li>
<li>Contact you about the progress of the recruitment process.</li>
<li>Keep your profile available for other compatible opportunities, if you do not advance in the current position.</li>
</ul>
<h4>4. Legal basis</h4>
<p>Processing is based on your consent (Art. 7, I, and Art. 11, I of the LGPD), given when you create your account. You may withdraw this consent at any time, without affecting the processing already carried out before the withdrawal.</p>
<h4>5. Who your data may be shared with</h4>
<p>Your data may be shared with the client company responsible for the position you applied to, solely for the purpose of evaluating your application. AGROSearch does not sell or share your data with third parties for marketing purposes.</p>
<h4>6. How long we keep your data</h4>
<p>While your profile remains active in our talent database, or until you request its deletion. Closed recruitment processes may be kept for a reasonable period for record-keeping purposes, after which the data is anonymized or deleted.</p>
<h4>7. Your rights as a data subject</h4>
<p>At any time, you may request:</p>
<ul>
<li>Confirmation that we process your data, and access to it;</li>
<li>Correction of incomplete, inaccurate, or outdated data;</li>
<li>Anonymization, blocking, or deletion of unnecessary data;</li>
<li>Portability of your data;</li>
<li>Information about who we share your data with;</li>
<li>Withdrawal of this consent.</li>
</ul>
<h4>8. How to exercise your rights</h4>
<p>Contact us by email at <b>cet@agrosearch.com.br</b>.</p>
<h4>9. Security</h4>
<p>We adopt reasonable technical and administrative measures to protect your data against unauthorized access and situations involving destruction, loss, alteration, unauthorized communication, or improper disclosure.</p>

  // ── router ─────────────────────────────────────────────────────────────────
  route(){
    var hash=location.hash||'';
    var m;
    if((m=hash.match(/^#\/vaga\/(-?\d+)$/))) return PublicATS.renderVaga(parseInt(m[1],10));
    if(hash.match(/^#\/vagas$/)) return PublicATS.renderVagasLista();
    // #/portal/disc/:applicationId — a vaga de contexto. Sem ela (link de convite do
    // staff, link salvo) o DISC roda sem trava de triagem, porque não há como saber de
    // qual vaga se trata e a triagem de uma vaga não pode barrar o DISC de outra.
    if((m=hash.match(/^#\/portal\/disc\/(\d+)$/))) return PublicATS.renderDisc(parseInt(m[1],10));
    if((m=hash.match(/^#\/portal\/disc$/))) return PublicATS.renderDisc(null);
    if((m=hash.match(/^#\/portal\/disc-convite\/(.+)$/))){
      PublicATS.setToken(decodeURIComponent(m[1]),true);
      location.hash='#/portal/disc'; // dispara hashchange, que chama route() de novo já na rota certa
      return;
    }
    if((m=hash.match(/^#\/portal\/questionario\/(\d+)$/))) return PublicATS.renderQuestionario(parseInt(m[1],10));
    if((m=hash.match(/^#\/portal\/questionario-convite\/(\d+)\/(.+)$/))){
      PublicATS.setToken(decodeURIComponent(m[2]),true);
      location.hash='#/portal/questionario/'+m[1];
      return;
    }
    if(hash.match(/^#\/portal\/minhas-candidaturas$/)) return PublicATS.renderMinhasCandidaturas();
    if((m=hash.match(/^#\/portal\/redefinir-senha\/(.+)$/))) return PublicATS.renderRedefinirSenha(decodeURIComponent(m[1]));
    document.getElementById('pub-page').innerHTML='<div class="pub-wrap pub-success"><h1>'+esc(t('pub_404_title'))+'</h1><p>'+esc(t('pub_404_msg'))+'</p>'+PublicATS.rodapeCandidaturasHtml()+'</div>';
  },

  // ── etapa 0: página pública da vaga ──────────────────────────────────────────
  async renderVaga(dealId){
    var page=document.getElementById('pub-page');
    page.innerHTML='<div class="pub-wrap"><div class="pub-loading">Carregando...</div></div>';
    var vaga;
    try{ vaga=await PublicATS.apiPub('GET','/public/vagas/'+dealId); }
    catch(e){ vaga=null; }
    if(!vaga){ page.innerHTML=''+PublicATS.headerHtml()+'<div class="pub-wrap"><div class="pub-empty">'+esc(t('pub_vaga_notfound'))+'</div></div>'; return; }
    PublicATS.flow.dealId=dealId;
    PublicATS.flow.vaga=vaga;
    if(!PublicATS.flow.dados.email) PublicATS.flow.dados=PublicATS._novosDados();
    PublicATS.flow.step='conta';

    // já logado? confirma se já se candidatou pra ESSA vaga antes de decidir a etapa.
    if(PublicATS.token()){
      try{
        var cand=await PublicATS.apiCand('GET','/public/candidates/me');
        PublicATS._preencherDadosDeConta(cand);
        return PublicATS._continueAfterAuth(cand);
      }catch(e){ /* token inválido/expirado — segue fluxo normal de login/conta */ }
    }
    PublicATS.renderStep();
  },

  // Ponto único depois de qualquer auth bem-sucedida (auto-login, login, signup) — decide
  // se manda o candidato pro wizard de candidatura ou pra tela de "você já se candidatou",
  // consultando se já existe candidatura dele pra ESSA vaga (flow.dealId).
  async _continueAfterAuth(cand){
    var flow=PublicATS.flow;
    try{
      var status=await PublicATS.apiCand('GET','/public/candidates/me/application-status/'+flow.dealId);
      if(status.applied&&status.completo){
        return PublicATS.renderJaCandidatado(cand,status);
      }
      if(status.applied){
        // Candidatura já existe mas ainda não tem pretensão (ex.: adicionado via
        // Hunting antes de se candidatar sozinho) — completa pelo wizard normal em vez
        // de travar num "já candidatado" sem nunca ter perguntado cargo/remuneração/
        // pretensão (bug real reportado pela Jamilly, 02/09/2026). submitApplication()
        // usa esse id pra completar em vez de tentar criar uma segunda candidatura.
        flow.applicationId=status.applicationId;
      }
    }catch(e){ /* se a checagem falhar, segue o fluxo normal em vez de travar o candidato */ }
    flow.step='perfil';
    PublicATS.renderStep();
  },

  // ── candidato que já se candidatou pra essa vaga (login/auto-login reconhece) ────
  // Reaproveita o mesmo raciocínio de 3 ramos do renderConfirmacao — precisa ser
  // idêntico porque essa tela é alcançada toda vez que o hash é re-processado sem
  // mudar (troca de idioma, F5, etc.) enquanto o candidato ainda está "recém
  // candidatado": PublicATS.route() → renderVaga() de novo → cai aqui direto, sem
  // passar pelo wizard, então o CTA daqui também precisa saber do questionário
  // pendente — senão empurra pro DISC direto e o gate só pega depois, na rota.
  async renderJaCandidatado(cand,status){
    var page=document.getElementById('pub-page');
    var vaga=PublicATS.flow.vaga;
    var primeiroNome=(cand.name||'').split(' ')[0];
    var statusMsg=status.rejected ? t('pub_jc_rejected') : t('pub_jc_active');
    var discHtml;
    if(cand.discResult){
      discHtml='<div class="pub-demo-box"><p><b>'+esc(t('pub_disc_title'))+':</b> '+esc(t('pub_jc_disc_done'))+'</p></div>';
    }else{
      var pend;
      // Escopado à candidatura DESTA vaga (status.applicationId) — antes consultava sem
      // escopo e podia mandar o candidato responder a triagem de OUTRA vaga.
      try{ pend=await PublicATS.apiCand('GET','/public/candidates/me/questionario-pendente?applicationId='+(status.applicationId||'')); }catch(e){ pend={pending:false}; }
      if(pend.pending){
        discHtml='<div class="pub-demo-box pub-disc-pendente"><p><b>'+esc(t('pub_q_invite_title'))+'</b> '+esc(t('pub_q_invite_desc'))+'</p>'
          +'<a class="btn-primary" href="#/portal/questionario/'+pend.applicationId+'">'+esc(t('pub_q_cta'))+' <i class="ti ti-arrow-right"></i></a></div>';
      }else{
        discHtml='<div class="pub-demo-box pub-disc-pendente"><p><b>'+esc(t('pub_disc_invite_title'))+'</b> '+esc(t('pub_disc_invite_desc'))+'</p>'
          +'<a class="btn-primary" href="#/portal/disc'+(status.applicationId?'/'+status.applicationId:'')+'">'+esc(t('pub_disc_cta'))+' <i class="ti ti-arrow-right"></i></a></div>';
      }
    }
    page.innerHTML=
      PublicATS.headerHtml()
      +'<div class="pub-wrap pub-success">'
      +'<div class="pub-status-icon"><i class="ti ti-check"></i></div>'
      +'<h1>'+esc(t('pub_jc_title'))+', '+esc(primeiroNome)+'!</h1>'
      +'<p>'+esc(t('pub_jc_desc_pre'))+' <b>'+esc(vaga.titulo)+'</b> '+esc(t('pub_jc_desc_post'))+' '+esc(statusMsg)+'</p>'
      +discHtml
      +PublicATS.rodapeCandidaturasHtml()
      +'<p class="pf-legal" style="margin-top:24px">'+esc(t('pub_jc_notyou'))+' <a href="#" id="btnSairJaCandidatado">'+esc(t('pub_jc_logout'))+'</a></p>'
      +'</div>';
    document.getElementById('btnSairJaCandidatado').addEventListener('click',function(e){
      e.preventDefault();
      PublicATS.clearToken();
      PublicATS.flow.dados=PublicATS._novosDados();
      PublicATS.flow.modoLogin=true;
      PublicATS.flow.step='conta';
      PublicATS.renderStep();
    });
  },
  _novosDados(){

      cvNome:null, cvManual:null, genero:'', cargoAtual:'', empresaAtual:'', remuneracaoValor:'', remuneracaoMoeda:'',
      primeiroEmprego:false,
      pretensaoValor:'', pretensaoMoeda:'',

  _preencherDadosDeConta(cand){

    d.remuneracaoValor=cand.currentSalaryAmount!=null?String(cand.currentSalaryAmount):''; d.remuneracaoMoeda=cand.currentSalaryCurrency||PublicATS.moedaPorPais(cand.country);
    d.idiomaPrincipal=cand.mainLanguage||'';

      +'<div class="modal-overlay" id="modal-privacidade" onclick="bgClose(event,\'modal-privacidade\')"><div class="modal pub-privacy-modal">'
      +'<div class="modal-hdr"><span class="modal-title">'+esc(t('pub_privacy_title'))+'</span><button class="modal-close" onclick="closeModal(\'modal-privacidade\')"><i class="ti ti-x"></i></button></div>'
      +'<div class="pub-privacy-body">'+(PUB_PRIVACY_HTML[currentLang]||PUB_PRIVACY_HTML.pt)+'</div>'
      +'<div class="modal-actions"><button type="button" class="btn-primary" onclick="closeModal(\'modal-privacidade\')">'+esc(t('pub_fechar_btn'))+'</button></div>'
      +'</div></div>';

    var pfAbrirPriv=document.getElementById('pfAbrirPrivacidade');
    if(pfAbrirPriv)pfAbrirPriv.addEventListener('click',function(e){ e.preventDefault(); openModal('modal-privacidade'); });

    document.getElementById('pfToggleLogin').addEventListener('click',function(e){ e.preventDefault(); flow.modoLogin=!flow.modoLogin; PublicATS.renderConta(); });

    document.getElementById('pubForm').addEventListener('submit',async function(e){
      e.preventDefault();
      var email=document.getElementById('pfEmail').value.trim();
      var senha=document.getElementById('pfSenha').value;
      var btn=e.target.querySelector('button[type=submit]');
      if(flow.modoLogin){
        if(!email||!senha){ PublicATS.toast(t('pub_toast_fill_email_pass'),'red'); return; }
        btn.disabled=true;
        try{
          var res=await PublicATS.apiPub('POST','/public/candidates/login',{email:email,password:senha});
          PublicATS.setToken(res.token);
          PublicATS._preencherDadosDeConta(res.candidate);
          await PublicATS._continueAfterAuth(res.candidate);
        }catch(err){ PublicATS.toast(err.message||t('pub_toast_login_error'),'red'); btn.disabled=false; }
        return;
      }
      var nome=document.getElementById('pfNome').value.trim();
      var senhaConfirm=document.getElementById('pfSenhaConfirm').value;
      var fone=document.getElementById('pfFone').value.trim();
      var consent=document.getElementById('pfConsentimento').checked;
      if(!nome||!email||!senha||!fone){ PublicATS.toast(t('pub_toast_fill_required'),'red'); return; }
      if(senha.length<6){ PublicATS.toast(t('pub_toast_senha_min'),'red'); return; }
      if(senha!==senhaConfirm){ PublicATS.toast(t('pub_toast_senha_confere'),'red'); return; }
      if(!consent){ PublicATS.toast(t('pub_toast_consent_required'),'red'); return; }
      btn.disabled=true;
      try{
        var res2=await PublicATS.apiPub('POST','/public/candidates/signup',{name:nome,email:email,password:senha,phone:fone,consent:true});
        PublicATS.setToken(res2.token);
        PublicATS._preencherDadosDeConta(res2.candidate);
        // Telefone igual a outro cadastro (e-mail diferente) — só avisa, não bloqueia
        // (decisão validada: coincidência de telefone é comum demais pra travar o fluxo).
        if(res2.duplicateWarning&&res2.duplicateWarning.field==='phone'){
          PublicATS.toast(t('pub_toast_phone_dup_pre')+' ('+res2.duplicateWarning.existingName+') '+t('pub_toast_phone_dup_post'));
        }
        flow.dados.nome=nome; flow.dados.fone=fone;
        await PublicATS._continueAfterAuth(res2.candidate);
      }catch(err){
        // E-mail já tem conta (login virou tela padrão, mas quem clicar em "criar conta
        // nova" mesmo já tendo uma ainda cai aqui) — em vez de só mostrar o erro, já
        // troca pra tela de login com o e-mail preenchido, poupando mais um passo.
        if(err.status===409){
          flow.dados.email=email;
          flow.modoLogin=true;
          PublicATS.renderConta();
          PublicATS.toast(t('pub_toast_email_exists_switch'),'red');
          return;
        }
        PublicATS.toast(err.message||t('pub_toast_signup_error'),'red'); btn.disabled=false;
      }
    });
  },

    function capturar(){

      var es=document.getElementById('pfEstado'); if(es)d.estado=es.value.trim();
      var pa=document.getElementById('pfPais'); if(pa)d.pais=pa.value.trim();
      var g=document.getElementById('pfCargoAtual'); if(g)d.cargoAtual=g.value.trim();
      var e2=document.getElementById('pfEmpresaAtual'); if(e2)d.empresaAtual=e2.value.trim();
      var rv=document.getElementById('pfRemuneracaoValor'); if(rv)d.remuneracaoValor=rv.value.trim();
      var rm=document.getElementById('pfRemuneracaoMoeda'); if(rm)d.remuneracaoMoeda=rm.value;
      var pv=document.getElementById('pfPretensaoValor'); if(pv)d.pretensaoValor=pv.value.trim();
      var pm=document.getElementById('pfPretensaoMoeda'); if(pm)d.pretensaoMoeda=pm.value;
      var ip=document.getElementById('pfIdiomaPrincipal'); if(ip)d.idiomaPrincipal=ip.value;
      var ipo=document.getElementById('pfIdiomaPrincipalOutro'); if(ipo)d.idiomaPrincipalOutro=ipo.value.trim();
      var ao=document.getElementById('pfAreaOutra'); if(ao)d.areaOutraTexto=ao.value.trim();
      var so=document.getElementById('pfSegmentoOutro'); if(so)d.segmentoOutroTexto=so.value.trim();

    }
    function bindMultiPill(groupId,arrRef,reRender){
      var el=document.getElementById(groupId); if(!el)return;
      el.querySelectorAll('.pill').forEach(function(btn){
        btn.addEventListener('click',function(){
          var val=btn.dataset.value, idx=arrRef.indexOf(val);
          if(idx>=0){ arrRef.splice(idx,1); btn.classList.remove('selected'); }
          else{ arrRef.push(val); btn.classList.add('selected'); }
          if(reRender){ capturar(); PublicATS.renderProfissional(); }
        });
      });
    }
    document.getElementById('pfGenero').addEventListener('change',function(){ d.genero=this.value; });
    var pfPrimeiroEmprego=document.getElementById('pfPrimeiroEmprego');
    if(pfPrimeiroEmprego)pfPrimeiroEmprego.addEventListener('change',function(){
      capturar();
      d.primeiroEmprego=this.checked;

      // lixo em campos que o candidato já disse não se aplicarem a ele.
      if(d.primeiroEmprego){ d.cargoAtual=''; d.empresaAtual=''; d.remuneracaoValor=''; }

    document.getElementById('pfDisponivel').addEventListener('change',function(){

    document.getElementById('pfIdiomaPrincipal').addEventListener('change',function(){ capturar(); PublicATS.renderProfissional(); });
    bindMultiPill('pillArea',d.areasAtuacao,true); bindMultiPill('pillSegmento',d.segmentos,true); bindMultiPill('pillModelo',d.modelosAtuacao);
    document.getElementById('pfDetalhesOpcionais').addEventListener('toggle',function(){ flow.uiOpcionalAberto=this.open; });

    document.querySelectorAll('.btnEditarManual').forEach(function(btn){ btn.addEventListener('click',function(){ capturar(); flow.step='cvManual'; PublicATS.renderStep(); }); });
    document.getElementById('btnAddIdioma').addEventListener('click',function(){ capturar(); d.idiomasAdicionais.push({idioma:PUB_IDIOMA_OPCOES[0],nivel:PUB_NIVEL_IDIOMA_OPCOES[0],idiomaOutro:''}); PublicATS.renderProfissional(); });
    document.querySelectorAll('.pfIdiomaRemove').forEach(function(btn){ btn.addEventListener('click',function(){ capturar(); d.idiomasAdicionais.splice(+btn.dataset.idx,1); PublicATS.renderProfissional(); }); });
    document.querySelectorAll('.pfIdiomaSel').forEach(function(sel){ sel.addEventListener('change',function(){ d.idiomasAdicionais[+sel.dataset.idx].idioma=sel.value; capturar(); PublicATS.renderProfissional(); }); });
    document.querySelectorAll('.pfNivelSel').forEach(function(sel){ sel.addEventListener('change',function(){ d.idiomasAdicionais[+sel.dataset.idx].nivel=sel.value; }); });
    document.querySelectorAll('.pfIdiomaOutro').forEach(function(inp){ inp.addEventListener('input',function(){ d.idiomasAdicionais[+inp.dataset.idx].idiomaOutro=inp.value; }); });

    document.getElementById('pubFormProfissional').addEventListener('submit',async function(e){
      e.preventDefault(); capturar();
      var btn=document.getElementById('btnProfissionalContinuar'); btn.disabled=true; btn.textContent=t('pub_prof_enviando');
      try{ await PublicATS.submitApplication(); }
      catch(err){ PublicATS.toast(err.message||t('pub_toast_send_error'),'red'); btn.disabled=false; btn.textContent=t('pub_prof_enviar'); }
    });
  },

  async submitApplication(){
    var flow=PublicATS.flow, d=flow.dados;
    var additionalLanguages=d.idiomasAdicionais.map(function(it){ return {idioma:it.idioma==='Outro'?(it.idiomaOutro||'Outro'):it.idioma, nivel:it.nivel}; });
    var areasAtuacao=d.areasAtuacao.map(function(a){ return a==='Outra'?(d.areaOutraTexto||'Outra'):a; });
    var segmentos=d.segmentos.map(function(s){ return s==='Outro'?(d.segmentoOutroTexto||'Outro'):s; });
    var body={
      name:d.nome, phone:d.fone, city:d.cidade, state:d.estado, country:d.pais, gender:d.genero, linkedin:d.linkedin,
      currentRole:d.cargoAtual, currentCompany:d.empresaAtual,
      currentSalaryAmount:d.remuneracaoValor?parseFloat(d.remuneracaoValor):null,
      currentSalaryCurrency:d.remuneracaoValor?(d.remuneracaoMoeda||PublicATS.moedaPorPais(d.pais)):null,
      mainLanguage:d.idiomaPrincipal==='Outro'?(d.idiomaPrincipalOutro||'Outro'):d.idiomaPrincipal,
      additionalLanguages:additionalLanguages, areasAtuacao:areasAtuacao, segmentos:segmentos,
      modelosAtuacao:d.modelosAtuacao, availableOtherRegions:d.disponibilidadeRegioes, regionsText:d.regioesDisponiveis,
      cvManual:d.cvManual||null,
    };
    var patchRes=await PublicATS.apiCand('PATCH','/public/candidates/me',body);
    if(patchRes&&patchRes._mergedToken){
      // Achou um cadastro do Hunting com o MESMO LinkedIn e fundiu nele (ver
      // AtsRepository.mergeCandidateAfterSignup) em vez de duplicar o candidato. A sessão
      // passa a ser a do cadastro que sobreviveu — as próximas chamadas (upload de
      // currículo, candidatura) têm que usar esse token, senão gravariam no cadastro que
      // acabou de ser apagado.
      PublicATS.setToken(patchRes._mergedToken);
      // Esse cadastro antigo pode já estar candidatado NESSA MESMA vaga (foi por isso que
      // a headhunter mandou o link) — se estiver, mostra o status dele em vez de tentar
      // criar uma segunda candidatura (que seria barrada de qualquer forma).
      var jaStatus;
      try{ jaStatus=await PublicATS.apiCand('GET','/public/candidates/me/application-status/'+flow.dealId); }catch(e){ jaStatus={applied:false}; }
      if(jaStatus.applied){
        var candMerged=await PublicATS.apiCand('GET','/public/candidates/me');
        return PublicATS.renderJaCandidatado(candMerged,jaStatus);
      }
    }
    if(d._cvFileObj){ await PublicATS.uploadResume(d._cvFileObj); d._cvFileObj=null; }
    // Pretensão salarial vai atrelada à candidatura (não ao candidato, como a
    // Remuneração atual acima) — a mesma pessoa pode pedir valores diferentes
    // dependendo da vaga.
    var application=await PublicATS.apiCand('POST','/public/vagas/'+flow.dealId+'/apply',{
      pretensaoSalarial:d.pretensaoValor?parseFloat(d.pretensaoValor):null,
      pretensaoMoeda:d.pretensaoValor?(d.pretensaoMoeda||d.remuneracaoMoeda||PublicATS.moedaPorPais(d.pais)):null,
    });
    flow.applicationId=application.id;
    // DISC é do CANDIDATO (perfil comportamental não muda de vaga pra vaga) — quem já
    // fez não precisa refazer. Já o questionário de triagem é da VAGA — cada vaga pode
    // ter perguntas diferentes — então é SEMPRE pedido de novo pra cada candidatura
    // nova, mesmo que o candidato já tenha feito DISC antes noutra vaga. Bug real
    // corrigido 01/09/2026: antes, já ter feito DISC uma vez pulava o questionário da
    // vaga nova inteiro, mesmo sem nunca ter sido respondido pra ela.
    flow.discJaFeito=!!(application.candidate&&application.candidate.discResult);
    flow.questionarioRespondido=false;
    // Questionário de triagem é obrigatório: entra direto no fluxo em vez de virar um
    // botão na tela de confirmação. Um clique a mais ali era um ponto de abandono — e é
    // justamente a etapa que filtra o candidato. A confirmação da inscrição não se perde:
    // aparece no topo do questionário e a tela completa vem logo depois de respondê-lo.
    if(flow.vaga&&flow.vaga.temQuestionario){
      return PublicATS.renderQuestionario(flow.applicationId);
    }
    flow.step='confirmacao';
    PublicATS.renderStep();
  },

      +'<li><b>'+esc(t('pub_conf_step1_b'))+'</b> — '+esc(t('pub_conf_step1'))+'</li>'

      +'<li><b>'+esc(t('pub_conf_step3_b'))+'</b>, '+esc(t('pub_conf_step3'))+'</li>'

  // Rodapé padrão das telas de fim de fluxo (ver CSS .pub-rodape-mc).
  rodapeCandidaturasHtml(){
    return '<div class="pub-rodape-mc"><i class="ti ti-clipboard-text"></i><span>'+esc(t('pub_rodape_mc'))

  // ── "Minhas Candidaturas" — lista de todos os processos do candidato, com status.
  // Rota persistente (#/portal/minhas-candidaturas): pode ser acessada a qualquer momento,
  // não só logo após se candidatar — por isso tem seu próprio mini-login (não reaproveita
  // renderConta(), que depende de flow.vaga, ausente quando o candidato entra direto por
  // bookmark/link).
  async renderMinhasCandidaturas(sessionExpired){
    var page=document.getElementById('pub-page');
    if(!PublicATS.token()){
      return PublicATS._renderMcLogin(sessionExpired);
    }
    page.innerHTML=PublicATS.headerHtml()+'<div class="pub-wrap-single"><div class="pub-loading">'+esc(t('pub_carregando'))+'</div></div>';
    var apps;
    try{ apps=await PublicATS.apiCand('GET','/public/candidates/me/applications'); }
    catch(e){
      if(e.status===401) return PublicATS._renderMcLogin(true);
      // Falha de rede/servidor NÃO pode cair no estado vazio — dizer "você não tem
      // nenhuma candidatura" pra quem tem processos em andamento é pior que mostrar erro.
      page.innerHTML=PublicATS.headerHtml()
        +'<div class="pub-wrap-single"><h1>'+esc(t('pub_mc_title'))+'</h1>'
        +'<div class="pub-empty"><p>'+esc(t('pub_mc_load_error'))+'</p>'
        +'<button type="button" class="btn-secondary" id="btnMcRetry" style="margin:12px auto 0">'+esc(t('pub_mc_retry'))+'</button></div></div>';
      document.getElementById('btnMcRetry').addEventListener('click',function(){ PublicATS.renderMinhasCandidaturas(); });
      return;
    }
    // DISC é do candidato, não de uma vaga — por isso o convite mora aqui, na tela que
    // reúne o perfil dele, e não numa candidatura específica. Best-effort: se essa
    // chamada falhar, a tela segue normal, só sem o destaque (não vale travar "Minhas
    // Candidaturas" inteira por causa de um bônus).
    var cand=null;
    try{ cand=await PublicATS.apiCand('GET','/public/candidates/me'); }catch(e){}
    var discCtaHtml=(cand&&!cand.discResult)
      ?'<div class="pub-demo-box pub-disc-pendente" style="margin-bottom:20px"><p><b>'+esc(t('pub_disc_invite_title'))+'</b> '+esc(t('pub_disc_invite_desc'))+'</p>'
        +'<a class="btn-primary" href="#/portal/disc">'+esc(t('pub_disc_cta'))+' <i class="ti ti-arrow-right"></i></a></div>'
      :'';
    var locale=currentLang==='en'?'en-US':currentLang==='es'?'es-ES':'pt-BR';
    var MC_STATUS={reprovado:'pub_mc_status_reprovado',contratado:'pub_mc_status_contratado',vaga_encerrada:'pub_mc_status_vaga_encerrada'};
    var listHtml=!apps.length
      ?'<div class="pub-empty"><p>'+esc(t('pub_mc_empty'))+'</p>'
        +'<a class="btn-secondary" href="#/vagas" style="margin:12px auto 0;display:inline-flex">'+esc(t('pub_mc_ver_vagas'))+' <i class="ti ti-arrow-right"></i></a></div>'
      :'<div class="pub-mc-list">'+apps.map(function(a){
        var statusClass=!a.encerrado?'andamento':(a.motivoEncerramento==='contratado'?'contratado':'encerrado');
        var statusLabel=!a.encerrado?t('pub_mc_status_andamento'):t(MC_STATUS[a.motivoEncerramento]||'pub_mc_status_vaga_encerrada');
        var dataStr=a.appliedAt?new Date(a.appliedAt).toLocaleDateString(locale):'—';
        return '<div class="pub-mc-card">'
          +'<div class="pub-mc-vaga">'+esc(a.vagaName||'—')+'</div>'
          +'<div class="pub-mc-data">'+esc(t('pub_mc_data_lbl'))+' '+esc(dataStr)+'</div>'
          +'<span class="pub-mc-status '+statusClass+'">'+esc(statusLabel)+'</span>'
          +'</div>';
      }).join('')+'</div>';
    page.innerHTML=PublicATS.headerHtml()
      +'<div class="pub-wrap-single"><h1>'+esc(t('pub_mc_title'))+'</h1><p>'+esc(t('pub_mc_subtitle'))+'</p>'
      +discCtaHtml
      +listHtml
      +'<p class="pf-legal" style="margin-top:24px"><a href="#" id="btnSairMinhasCandidaturas">'+esc(t('pub_jc_logout'))+'</a></p>'
      +'</div>';
    document.getElementById('btnSairMinhasCandidaturas').addEventListener('click',function(e){
      e.preventDefault();
      PublicATS.clearToken();
      PublicATS.renderMinhasCandidaturas();
    });
  },
  _renderMcLogin(sessionExpired){
    var page=document.getElementById('pub-page');
    page.innerHTML=PublicATS.headerHtml()
      +'<div class="pub-wrap-single"><div class="pub-card">'
      +'<h2>'+esc(t('pub_mc_title'))+'</h2>'

      +'<button type="submit" class="btn-primary pf-submit">'+esc(t('pub_entrar_btn'))+'</button>'
      // Sem conta ainda? Sem isso o candidato que cai aqui por link/bookmark fica sem

      +'<p class="pf-legal">'+esc(t('pub_mc_sem_conta'))+' <a href="#/vagas">'+esc(t('pub_mc_ver_vagas'))+'</a></p>'

      +'</form></div></div>';

      e.preventDefault();

  // ── redefinição de senha (link de curta duração gerado pelo staff, ver
  //    ATS.copyPasswordResetLink) — diferente dos convites de DISC/Questionário, o ticket
  //    NÃO vira sessão direto: é trocado por um token de verdade só depois de definir a
  //    senha nova (ver resetCandidatePassword em atsPublic.js).
  renderRedefinirSenha(ticket){
    var page=document.getElementById('pub-page');
    page.innerHTML=PublicATS.headerHtml()
      +'<div class="pub-wrap-single"><div class="pub-card">'
      +'<h2>'+esc(t('pub_reset_h1'))+'</h2><p>'+esc(t('pub_reset_desc'))+'</p>'
      +'<form id="pubFormReset">'
      +'<div class="pf-field"><label>'+esc(t('pub_nova_senha_star'))+'</label><input required type="password" id="rsSenha" autocomplete="new-password" placeholder="'+esc(t('pub_senha_min_ph'))+'"></div>'
      +'<div class="pf-field"><label>'+esc(t('pub_confirmar_nova_senha_star'))+'</label><input required type="password" id="rsSenhaConfirm" autocomplete="new-password"></div>'

  // ── questionário de triagem (por candidatura, obrigatório antes do DISC) ────
  async renderQuestionario(applicationId){
    var page=document.getElementById('pub-page');
    if(!PublicATS.token()){
      page.innerHTML=''+PublicATS.headerHtml()+'<div class="pub-wrap pub-success"><div class="pub-status-icon alerta"><i class="ti ti-alert-triangle"></i></div><h1>'+esc(t('pub_disc_login_title'))+'</h1><p>'+esc(t('pub_disc_login_desc'))+'</p>'
        +'<a class="btn-primary" href="#/portal/minhas-candidaturas" style="margin-top:8px;display:inline-flex">'+esc(t('pub_entrar_btn'))+' <i class="ti ti-arrow-right"></i></a></div>';
      return;
    }
    page.innerHTML='<div class="pub-wrap"><div class="pub-loading">'+esc(t('pub_carregando'))+'</div></div>';
    var res;
    try{ res=await PublicATS.apiCand('GET','/public/applications/'+applicationId+'/questionario'); }
    catch(e){ page.innerHTML=''+PublicATS.headerHtml()+'<div class="pub-wrap pub-success"><h1>'+esc(t('pub_404_title'))+'</h1><p>'+esc(e.message||t('pub_404_msg'))+'</p>'+PublicATS.rodapeCandidaturasHtml()+'</div>'; return; }

    if(res.respondido){
      var linhasHtml=(res.respostas||[]).map(function(r){
        return '<div class="pf-field"><label>'+esc(r.texto)+'</label><p style="margin:4px 0 0;color:var(--text-dim)">'+esc(r.resposta||'—')+'</p></div>';
      }).join('');
      page.innerHTML=''+PublicATS.headerHtml()+'<div class="pub-wrap pub-success"><div class="pub-status-icon"><i class="ti ti-check"></i></div><h1>'+esc(t('pub_q_ja_respondeu'))+'</h1><p>'+esc(t('pub_obrigado'))+'!</p>'+linhasHtml+'<a class="btn-primary" href="#/portal/disc" style="margin-top:16px;display:inline-flex">'+esc(t('pub_disc_cta'))+' <i class="ti ti-arrow-right"></i></a>'+PublicATS.rodapeCandidaturasHtml()+'</div>';
      return;
    }

    var perguntasHtml=(res.perguntas||[]).map(function(p,pi){
      var reqMark=p.obrigatoria?' *':'';
      if(p.tipo==='multipla_escolha'){
        var inputType=p.permiteVarias?'checkbox':'radio';
        // "required" no HTML só faz sentido pro rádio (o navegador já barra o submit
        // sozinho, um por grupo); num grupo de checkbox cada input é independente — o
        // navegador exigiria TODAS marcadas, não "pelo menos uma". Obrigatoriedade de
        // checkbox é validada em JS antes de enviar (ver mais abaixo).
        var opcoesHtml=(p.opcoes||[]).map(function(op){
          return '<label class="pf-radio-opt"><input type="'+inputType+'" name="q_'+pi+(p.permiteVarias?'[]':'')+'" value="'+esc(op)+'"'+(p.obrigatoria&&!p.permiteVarias?' required':'')+'> '+esc(op)+'</label>';
        }).join('');
        return '<div class="pf-field" data-pergunta-id="'+esc(p.id)+'" data-pergunta-tipo="multipla_escolha" data-permite-varias="'+(p.permiteVarias?'1':'0')+'" data-obrigatoria="'+(p.obrigatoria?'1':'0')+'"><label>'+esc(p.texto)+esc(reqMark)+'</label><div class="pf-radio-group">'+opcoesHtml+'</div></div>';
      }
      return '<div class="pf-field" data-pergunta-id="'+esc(p.id)+'" data-pergunta-tipo="texto_livre"><label>'+esc(p.texto)+esc(reqMark)+'</label><textarea rows="3" style="width:100%;box-sizing:border-box"'+(p.obrigatoria?' required':'')+'></textarea></div>';
    }).join('');

    // Sem selo de "inscrição enviada" aqui de propósito: mostrar isso antes do
    // questionário dava a entender que o essencial já tinha sido feito e a triagem era
    // só um extra opcional. A confirmação de verdade só aparece DEPOIS de responder (ver
    // submitApplication/o listener de submit abaixo) — a triagem é a etapa principal
    // aqui, não um adendo.
    page.innerHTML=''+PublicATS.headerHtml()
      +'<div class="pub-wrap"><div class="pub-main"><h1>'+esc(t('pub_q_h1'))+'</h1><p>'+esc(t('pub_q_intro'))+'</p></div>'
      +'<form class="pub-form" id="pubQuestionarioForm">'+perguntasHtml
      +'<button type="submit" class="btn-primary pf-submit">'+esc(t('pub_q_enviar_btn'))+'</button>'
      +'</form></div>';

    document.getElementById('pubQuestionarioForm').addEventListener('submit',async function(e){
      e.preventDefault();
      var respostas=[], faltouObrigatoria=false;
      document.querySelectorAll('#pubQuestionarioForm [data-pergunta-id]').forEach(function(field){
        var pid=field.dataset.perguntaId, tipo=field.dataset.perguntaTipo, resposta='';
        if(tipo==='multipla_escolha'&&field.dataset.permiteVarias==='1'){
          resposta=Array.from(field.querySelectorAll('input[type=checkbox]:checked')).map(function(cb){return cb.value;});
          if(field.dataset.obrigatoria==='1'&&!resposta.length)faltouObrigatoria=true;
        }else if(tipo==='multipla_escolha'){
          var checked=field.querySelector('input[type=radio]:checked');
          resposta=checked?checked.value:'';
        }else{
          resposta=field.querySelector('textarea').value.trim();
        }
        respostas.push({perguntaId:pid, resposta:resposta});
      });
      if(faltouObrigatoria){ PublicATS.toast(t('pub_q_erro_obrigatoria'),'red'); return; }
      var btn=e.target.querySelector('button[type=submit]');
      btn.disabled=true;
      try{
        await PublicATS.apiCand('POST','/public/applications/'+applicationId+'/questionario/submit',{respostas:respostas});
        // Veio do fluxo de inscrição: mostra agora a tela de confirmação completa (próximos
        // passos, convite pro DISC e link das candidaturas).
        if(PublicATS.flow.vaga&&PublicATS.flow.applicationId===applicationId){
          PublicATS.flow.questionarioRespondido=true;
          PublicATS.flow.step='confirmacao';
          return PublicATS.renderStep();
        }
        // Quem chegou por link de convite (Hunting, sem conta/senha própria) ANTES caía
        // direto no DISC sem escolha — achado real 15/09/2026 (relato da coordenação):
        // o candidato tinha que preencher na hora, sem opção de voltar depois. Agora
        // mostra a mesma pausa "agora ou depois" do fluxo normal, só que sem o CTA de
        // "Minhas Candidaturas" (esse candidato não tem senha própria, não consegue
        // entrar lá) — a única forma de retomar depois é reabrir o mesmo link de
        // convite, que é reutilizável por 14 dias.
        var pageConvite=document.getElementById('pub-page');
        pageConvite.innerHTML=''+PublicATS.headerHtml()+'<div class="pub-wrap pub-success"><div class="pub-status-icon"><i class="ti ti-check"></i></div><h1>'+esc(t('pub_q_enviado_titulo'))+'</h1>'
          +'<div class="pub-demo-box pub-disc-pendente"><p><b>'+esc(t('pub_disc_invite_title'))+'</b> '+esc(t('pub_disc_invite_desc'))+' '+esc(t('pub_disc_invite_desc2_convite'))+'</p>'
          +'<a class="btn-primary" href="#/portal/disc/'+applicationId+'">'+esc(t('pub_disc_cta'))+' <i class="ti ti-arrow-right"></i></a></div></div>';
      }catch(err){ PublicATS.toast(err.message||t('pub_toast_send_error'),'red'); btn.disabled=false; }
    });
  },

  // ── teste DISC ─────────────────────────────────────────────────────────────
  async renderDisc(applicationId){
    var page=document.getElementById('pub-page');
    if(!PublicATS.token()){
      page.innerHTML=''+PublicATS.headerHtml()+'<div class="pub-wrap pub-success"><div class="pub-status-icon alerta"><i class="ti ti-alert-triangle"></i></div><h1>'+esc(t('pub_disc_login_title'))+'</h1><p>'+esc(t('pub_disc_login_desc'))+'</p>'
        +'<a class="btn-primary" href="#/portal/minhas-candidaturas" style="margin-top:8px;display:inline-flex">'+esc(t('pub_entrar_btn'))+' <i class="ti ti-arrow-right"></i></a></div>';
      return;
    }
    page.innerHTML='<div class="pub-wrap"><div class="pub-loading">'+esc(t('pub_carregando'))+'</div></div>';
    // Gate de verdade (não só o botão escondido na confirmação) — cobre link de convite
    // antigo, aba favoritada, ou qualquer outro jeito de chegar direto nessa rota.
    // Reconsulta do zero pelo candidateId do token, não pelo flow em memória (que pode
    // ter se perdido se a pessoa fechou a aba e voltou depois).
    try{
      // Escopado à candidatura de origem: a triagem de outra vaga não barra este DISC.
      // Sem candidatura de contexto o servidor devolve pending:false e o DISC segue.
      var pend=await PublicATS.apiCand('GET','/public/candidates/me/questionario-pendente?applicationId='+(applicationId||''));
      if(pend.pending){ location.hash='#/portal/questionario/'+pend.applicationId; return; }
    }catch(e){ /* se a checagem falhar, segue pro DISC normalmente — não trava o candidato por um erro de rede */ }
    var cand;
    try{ cand=await PublicATS.apiCand('GET','/public/candidates/me'); }
    catch(e){ return PublicATS.renderDisc(applicationId); }

    if(cand.discResult){
      page.innerHTML=''+PublicATS.headerHtml()+'<div class="pub-wrap pub-success"><div class="pub-status-icon"><i class="ti ti-check"></i></div><h1>'+esc(t('pub_disc_ja_respondeu'))+'</h1><p>'+esc(t('pub_obrigado'))+', '+esc((cand.name||'').split(' ')[0])+'! '+esc(t('pub_disc_respostas_enviadas'))+'</p>'+PublicATS._discResultHtml(cand.discResult)+''+PublicATS.rodapeCandidaturasHtml()+'</div>';
      return;
    }

    var PUB_DISC_BLOCKS=pubBuildDiscBlocks(); // recalculado aqui, não no load do script — precisa refletir currentLang atual
    var blocksHtml=PUB_DISC_BLOCKS.map(function(bloco,bi){
      return '<div class="disc-block" data-block="'+bi+'"><div class="disc-block-head"><span class="disc-block-title">'+esc(t('pub_disc_bloco'))+' '+(bi+1)+' '+esc(t('pub_de'))+' '+PUB_DISC_BLOCKS.length+'</span><span class="disc-block-status" data-status="'+bi+'"></span></div>'
        +'<div class="disc-block-cols"><span></span><span class="disc-col-label">+ '+esc(t('pub_disc_mais'))+'</span><span class="disc-col-label">– '+esc(t('pub_disc_menos'))+'</span></div>'
        +bloco.map(function(item,wi){
          return '<div class="disc-word-row"><span class="disc-word">'+esc(item.texto)+'</span>'
            +'<label class="disc-opt"><input type="radio" name="mais_'+bi+'" value="'+item.letra+'" data-role="mais" data-block="'+bi+'" data-word="'+wi+'"><span class="disc-opt-dot"></span></label>'
            +'<label class="disc-opt"><input type="radio" name="menos_'+bi+'" value="'+item.letra+'" data-role="menos" data-block="'+bi+'" data-word="'+wi+'"><span class="disc-opt-dot"></span></label></div>';
        }).join('')+'</div>';
    }).join('');

    page.innerHTML=
      PublicATS.headerHtml()
      +'<div class="disc-progress-bar" id="discProgress"><div class="disc-progress-inner">'
      +'<div class="disc-progress-texto"><b id="discProgressNum">0</b> '+esc(t('pub_de'))+' '+PUB_DISC_BLOCKS.length+' '+esc(t('pub_disc_blocos_respondidos'))+'</div>'
      +'<div class="disc-progress-track"><div class="disc-progress-fill" id="discProgressFill" style="width:0%"></div></div></div></div>'
      +'<div class="disc-wrap"><div class="disc-intro"><div class="pub-tag">'+esc(t('pub_disc_tag'))+'</div><h1>'+esc(t('pub_disc_h1'))+'</h1>'
      +'<p>'+esc(t('pub_disc_ola'))+', <b>'+esc((cand.name||'').split(' ')[0])+'</b>! '+esc(t('pub_disc_intro1'))+' <b>'+esc(t('pub_disc_mais').toUpperCase())+'</b> '+esc(t('pub_disc_intro2'))+' <b>'+esc(t('pub_disc_menos').toUpperCase())+'</b> '+esc(t('pub_disc_intro3'))+' '
      +esc(t('pub_disc_intro4'))+' '+PUB_DISC_BLOCKS.length+' '+esc(t('pub_disc_intro5'))+'</p>'
      +'<p class="disc-intro-uso">'+esc(t('pub_disc_uso'))+'</p></div>'
      +'<form id="discForm">'+blocksHtml+'<div class="disc-submit-area"><div class="disc-submit-aviso" id="discAviso"></div>'
      +'<button type="submit" class="btn-primary pf-submit disc-submit">'+esc(t('pub_disc_enviar_btn'))+'</button></div></form></div>';

    // Restaura o preenchimento guardado quando o envio foi barrado por um questionário
    // pendente de outra vaga — a pessoa não refaz os 24 blocos.
    // Desde 11/11/2026 o rascunho é salvo a cada marcação, no localStorage do aparelho e
    // amarrado ao candidato: se a sessão cair (aba recarregada, link reaberto), as respostas
    // voltam ao abrir o DISC de novo. Vale 14 dias (mesmo prazo do convite).
    var rascunho=PublicATS._discRascunhoLer(cand);
    if(rascunho){
      var restaurou=false;
      rascunho.forEach(function(r,bi){
        if(!r)return;
        ['mais','menos'].forEach(function(papel){
          var el=r[papel]&&document.querySelector('input[name="'+papel+'_'+bi+'"][value="'+r[papel]+'"]');
          if(el){el.checked=true;restaurou=true;}
        });
      });
      if(restaurou)PublicATS.toast(t('pub_disc_rascunho_ok'));
    }
    function salvarRascunho(){
      var arr=[];
      for(var bi=0;bi<PUB_DISC_BLOCKS.length;bi++){
        var ma=document.querySelector('input[name="mais_'+bi+'"]:checked'),me=document.querySelector('input[name="menos_'+bi+'"]:checked');
        arr.push((ma||me)?{mais:ma?ma.value:null,menos:me?me.value:null}:null);
      }
      PublicATS._discRascunhoSalvar(cand,arr);
    }

    function blocoCompleto(bi){ return !!document.querySelector('input[name="mais_'+bi+'"]:checked')&&!!document.querySelector('input[name="menos_'+bi+'"]:checked'); }
    function atualizarProgresso(){
      var feitos=0;
      for(var bi=0;bi<PUB_DISC_BLOCKS.length;bi++){
        var ok=blocoCompleto(bi); if(ok)feitos++;
        var bloco=document.querySelector('.disc-block[data-block="'+bi+'"]');
        var status=document.querySelector('[data-status="'+bi+'"]');
        if(status)status.innerHTML=ok?'<i class="ti ti-check"></i>':'';
        if(bloco){ bloco.classList.toggle('respondido',ok); if(ok)bloco.classList.remove('faltando'); }
      }
      document.getElementById('discProgressNum').textContent=feitos;
      document.getElementById('discProgressFill').style.width=Math.round(feitos/PUB_DISC_BLOCKS.length*100)+'%';
      document.getElementById('discProgress').classList.toggle('completo',feitos===PUB_DISC_BLOCKS.length);
      return feitos;
    }
    document.querySelectorAll('.disc-word-row input[type=radio]').forEach(function(input){
      input.addEventListener('change',function(){
        var bi=input.dataset.block, wi=input.dataset.word;
        var oppositeRole=input.dataset.role==='mais'?'menos':'mais';
        var opposite=document.querySelector('input[data-role="'+oppositeRole+'"][data-block="'+bi+'"][data-word="'+wi+'"]');
        // Não dá pra marcar a MESMA palavra como "+ mais" e "- menos" ao mesmo tempo
        // (não faz sentido no DISC — não pode ser a característica mais E menos parecida
        // com você ao mesmo tempo). Antes isso desmarcava a escolha anterior em silêncio;
        // o candidato terminava o teste achando que tinha respondido tudo e, ao enviar,
        // a validação acusava blocos "faltando" sem nenhuma pista do motivo. Agora avisa
        // na hora, exatamente quando a marcação anterior é desfeita.
        if(opposite&&opposite.checked){ opposite.checked=false; PublicATS.toast(t('pub_disc_mesma_palavra'),'red'); }
        atualizarProgresso();
        salvarRascunho();
      });
    });
    atualizarProgresso();

    document.getElementById('discForm').addEventListener('submit',async function(e){
      e.preventDefault();
      var faltando=[];
      for(var bi=0;bi<PUB_DISC_BLOCKS.length;bi++){
        var bloco=document.querySelector('.disc-block[data-block="'+bi+'"]');
        if(!blocoCompleto(bi)){ faltando.push(bi+1); bloco.classList.add('faltando'); } else bloco.classList.remove('faltando');
      }
      if(faltando.length){
        document.getElementById('discAviso').textContent=t('pub_disc_faltam')+' '+faltando.join(', ')+'.';
        document.querySelector('.disc-block[data-block="'+(faltando[0]-1)+'"]').scrollIntoView({behavior:'smooth',block:'center'});
        return;
      }
      var responses=[];
      for(var b=0;b<PUB_DISC_BLOCKS.length;b++){
        responses.push({ mais:document.querySelector('input[name="mais_'+b+'"]:checked').value, menos:document.querySelector('input[name="menos_'+b+'"]:checked').value });
      }
      var btn=e.target.querySelector('button[type=submit]'); btn.disabled=true; btn.textContent=t('pub_prof_enviando');
      try{
        var res=await PublicATS.apiCand('POST','/public/disc/submit',{responses:responses,applicationId:applicationId||null});
        PublicATS._discRascunhoApagar();
        page.innerHTML=''+PublicATS.headerHtml()+'<div class="pub-wrap pub-success"><div class="pub-status-icon"><i class="ti ti-check"></i></div><h1>'+esc(t('pub_disc_enviado_title'))+'</h1><p>'+esc(t('pub_disc_enviado_desc'))+'</p>'+PublicATS._discResultHtml(res.discResult)+''+PublicATS.rodapeCandidaturasHtml()+'</div>';
      }catch(err){
        // Barrado por um questionário pendente de OUTRA vaga: a pessoa já preencheu os 24
        // blocos, então guarda as respostas e leva ela direto pro questionário que falta —
        // ao voltar pro DISC o preenchimento é restaurado. Sem isso o trabalho era perdido
        // e a mensagem não dizia sequer qual vaga estava faltando.
        if(err.questionarioPendente&&err.questionarioPendente.applicationId){
          PublicATS._discRascunhoSalvar(cand,responses);
          PublicATS.toast(err.message,'red');
          setTimeout(function(){ location.hash='#/portal/questionario/'+err.questionarioPendente.applicationId; },1800);
          return;
        }
        // Sessão perdida no envio: as respostas já estão no rascunho (salvo a cada marcação);
        // explica o que fazer em vez do "Unauthorized" cru, e deixa o aviso fixo na tela.
        if(err.status===401){
          PublicATS._discRascunhoSalvar(cand,responses);
          document.getElementById('discAviso').textContent=t('pub_disc_sessao_perdida');
          PublicATS.toast(t('pub_disc_sessao_perdida'),'red');
          btn.disabled=false; btn.textContent=t('pub_disc_enviar_btn');
          return;
        }
        PublicATS.toast(err.message||t('pub_toast_disc_error'),'red'); btn.disabled=false; btn.textContent=t('pub_disc_enviar_btn');
      }
    });
  },
  _discResultHtml(result){
    if(!result||!result.adaptado)return '';
    var cores={D:'#e0455a',I:'#eab308',S:'#3b7ddb',C:'#8b5cf6'};
    var nomes={D:t('pub_disc_d'),I:t('pub_disc_i'),S:t('pub_disc_s'),C:t('pub_disc_c')};
    var letras=['D','I','S','C'];
    var maior=letras.reduce(function(best,l){return result.adaptado[l]>result.adaptado[best]?l:best;},'D');
    var bars=letras.map(function(l){
      var v=Math.max(0,Math.min(100,result.adaptado[l]||0));
      return '<div class="disc-vbar-col"><span class="disc-vbar-valor">'+v+'</span><div class="disc-vbar-track"><div class="disc-vbar-fill" style="height:'+v+'%;background:'+cores[l]+'"></div></div><span class="disc-vbar-label" style="color:'+cores[l]+'">'+l+'</span></div>';
    }).join('');
    return '<div class="disc-vbar-panel"><div class="disc-vbar-titulo">'+esc(t('pub_disc_perfil_predominante'))+': <b style="color:'+cores[maior]+'">'+esc(nomes[maior])+'</b></div><div class="disc-vbar-chart">'+bars+'</div></div>';
  },
};

// ── Boot ──────────────────────────────────────────────────────────────────────
// Sem hash nenhum (alguém digitou só o endereço do portal) cai na lista de vagas, que é
// a porta de entrada natural — antes essa situação nem existia, porque o portal só era
// alcançado por um link com hash.
if(!location.hash){ location.replace(location.pathname+'#/vagas'); }
else { PublicATS.route(); }
window.addEventListener('hashchange',function(){ PublicATS.route(); });
</script>
</body>
