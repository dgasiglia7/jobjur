name: Busca diária e painel

on:
  schedule:
    - cron: "0 10 * * *"  # todo dia às 07:00 de Brasília
  workflow_dispatch:      # botão "Run workflow" para buscar na hora
  push:
    branches: [main]
    paths: ["docs/**"]    # republica o painel quando o status é marcado

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: painel
  cancel-in-progress: false

jobs:
  buscar:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Perfil (guardado no segredo JOBJUR_PERFIL, fora do código)
        env:
          PERFIL: ${{ secrets.JOBJUR_PERFIL }}
        run: |
          if [ -z "$PERFIL" ]; then
            echo "::error::Crie o segredo JOBJUR_PERFIL com o conteúdo do perfil.json (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          mkdir -p dados
          printf '%s' "$PERFIL" > dados/perfil.json
      - name: Buscar vagas e acrescentar as novas ao painel
        run: python -m jobjur.buscar dados/perfil.json --sem-claude --painel docs/vagas.json
      - name: Marcar as vagas pendentes que já foram encerradas nos sites
        run: python -m jobjur.painel verificar
      - name: Salvar no repositório
        run: |
          git config user.name "jobjur"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/vagas.json
          if git diff --cached --quiet; then echo "Nada novo."; exit 0; fi
          git commit -m "Painel: vagas da busca de $(TZ=America/Sao_Paulo date '+%d/%m/%Y às %H:%M')"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1

  publicar:
    needs: buscar
    if: ${{ !cancelled() && (needs.buscar.result == 'success' || needs.buscar.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
