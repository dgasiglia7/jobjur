name: Sondagem (temporário)
on:
  push:
    branches: [claude/sonda-empresas]
jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: claude/fonte-portais}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: |
          PYTHONPATH=. python - <<'PY'
          import logging; logging.basicConfig(level=logging.INFO)
          from jobjur.fontes import portais
          vs = portais.coletar(portais.Cliente())
          print("TOTAL", len(vs))
          for v in vs: print("VAGA |", v.titulo, "|", v.empresa, "|", v.local, "|", v.modalidade, "|", v.url)
          PY
