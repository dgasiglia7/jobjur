name: Sondagem (temporário)
on:
  push:
    branches: [claude/sonda-empresas]
permissions:
  contents: write
jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install httpx beautifulsoup4
      - run: python scripts/sondar.py
      - run: |
          git config user.name sonda; git config user.email sonda@users.noreply.github.com
          git add -f paginas && git commit -qm "páginas salvas [skip ci]" && git push origin HEAD:claude/sonda-empresas || true
